# Nginx config: allow GET for employees on /api/employees
# and require admin for POST/PUT/DELETE

upstream backend {
  server 127.0.0.1:8081;
}

server {
  listen 80;
  server_name _;

  # Serve the SPA
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Employees endpoint: GET (and OPTIONS for CORS) allowed for authenticated employees,
  # other methods require admin credentials
  location ^~ /api/employees {
    # Default: employee auth for GET requests
    auth_basic "Employee Area";
    auth_basic_user_file /etc/nginx/.htpasswd_employe;

    # Forward employee identity to backend for GET requests
    proxy_set_header X-Employee-Cin $remote_user;

    # For non-GET/OPTIONS methods, switch to admin-only auth
    limit_except GET OPTIONS {
      # Override auth to admin realm for write operations
      auth_basic "Admin Area";
      auth_basic_user_file /etc/nginx/.htpasswd_admin;

      # Do not forward employee identity for admin actions
      proxy_set_header X-Employee-Cin "";
    }

    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Generic API proxy for other endpoints
  location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
